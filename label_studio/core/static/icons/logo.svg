<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="grad1-anim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4e54c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8f94fb;stop-opacity:1" />
    </linearGradient>
    <style>
      .text-v1 {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-weight: 700;
        font-size: 32px;
        fill: #2d3436;
      }
      /* CSS Animation for data flow lines */
      .data-flow-line {
        stroke-dasharray: 10, 20; /* Dash length, Gap length */
        animation: flowAnimation 3s linear infinite;
      }
      @keyframes flowAnimation {
        to { stroke-dashoffset: -30; } /* Move left by dash+gap width */
      }
    </style>
  </defs>

  <g transform="translate(10, 10)">
    <g>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />

        <path d="M 16 0 L 28 8 L 16 16 L 4 8 Z" fill="url(#grad1-anim)" />
        <path d="M 8 12 L 16 18 L 8 24 L 0 18 Z" fill="#4e54c8" opacity="0.8" />
        <path d="M 24 12 L 32 18 L 24 24 L 16 18 Z" fill="#8f94fb" opacity="0.8" />
    </g>

    <line x1="-10" y1="28" x2="42" y2="28" stroke="#00d2ff" stroke-width="2" opacity="0.6" stroke-linecap="round" class="data-flow-line"/>
    <line x1="-5" y1="32" x2="37" y2="32" stroke="#00d2ff" stroke-width="2" opacity="0.4" stroke-linecap="round" class="data-flow-line" style="animation-duration: 4s; animation-direction: reverse;"/>
  </g>

  <text x="50" y="38" class="text-v1">Isolyt</text>
</svg>